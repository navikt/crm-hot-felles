<template>
    <span
        class={tagClass}
        data-color={resolvedColor}
        data-variant={resolvedVariant}
        aria-label={ariaLabel}
    >
        <template if:true={hasIcon}>
            <span class="tag__icon" aria-hidden="true">
                <slot name="icon"></slot>
            </span>
        </template>

        <slot>{label}</slot>
    </span>
</template>
